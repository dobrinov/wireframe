<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component library · Wireframe</title>
<meta name="description" content="Every wf component: greyscale, keyboard-usable LoFi building blocks with live examples and copy-ready snippets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F7F6F2'/%3E%3Cg fill='none' stroke='%231C1C1A' stroke-width='2.6'%3E%3Cpath d='M10 5H5v22h5M22 5h5v22h-5' stroke-linecap='square'/%3E%3Cpath d='M9.5 11l2.8 10 3.7-7.5 3.7 7.5 2.8-10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/_wf/wf.css">
<script type="module" src="/_wf/wf.js"></script>
<style>
  /* Page chrome. Classes use the wf-x-lib- prefix so wf.css's base styles leave them alone. */
  body.lib { margin: 0; background: #F7F6F2; color: #1C1C1A; font: 14px/1.45 Inter, system-ui, sans-serif; }
  .lib *, .lib *::before, .lib *::after { box-sizing: border-box; }
  .wf-x-lib-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .wf-x-lib-k { font: 500 11px 'JetBrains Mono', monospace; color: #55554F; letter-spacing: .06em; text-transform: uppercase; }

  .wf-x-lib-head { background: #FFFFFF; border-bottom: 1.5px solid #1C1C1A; position: sticky; top: 0; z-index: 20; }
  .wf-x-lib-head-in { max-width: 1440px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  a.wf-x-lib-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C1C1A; }
  .wf-x-lib-brand svg { width: 32px; height: 32px; flex: none; }
  .wf-x-lib-brand b { font: 700 18px 'Space Grotesk', Inter, sans-serif; }
  .wf-x-lib-count { font: 12px 'JetBrains Mono', monospace; color: #55554F; }
  .wf-x-lib-search { margin-left: auto; flex: 0 1 360px; display: flex; align-items: center; gap: 8px; height: 40px; border: 1.5px solid #8A887F; border-radius: 20px; padding: 0 14px; background: #FFFFFF; }
  .wf-x-lib-search:focus-within { border-color: #1C1C1A; box-shadow: 0 0 0 1px #1C1C1A; }
  #q { all: unset; flex: 1; min-width: 0; font-size: 14px; height: 100%; }
  #q::-webkit-search-cancel-button { cursor: pointer; }
  .wf-x-lib-search kbd { font: 11px 'JetBrains Mono', monospace; color: #55554F; border: 1px solid #D6D4CC; border-radius: 4px; padding: 0 5px; }
  a.wf-x-lib-home { font-size: 14px; color: #1C1C1A; white-space: nowrap; }

  .wf-x-lib-body { max-width: 1440px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; align-items: flex-start; }
  .wf-x-lib-nav { flex: none; width: 210px; position: sticky; top: 89px; display: flex; flex-direction: column; gap: 2px; }
  .wf-x-lib-cat { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  .wf-x-lib-cat:hover { background: #EFEDE6; }
  .wf-x-lib-cat[aria-pressed="true"] { background: #1C1C1A; color: #FFFFFF; font-weight: 600; }
  .wf-x-lib-cat span { font: 12px 'JetBrains Mono', monospace; opacity: .75; }
  .wf-x-lib-cat:focus-visible, .wf-x-lib-det:focus-visible, .wf-x-lib-close:focus-visible, .wf-x-lib-copy:focus-visible { outline: 2px solid #2B59C3; outline-offset: 2px; }
  .wf-x-lib-rules { margin-top: 18px; padding: 14px 12px; border-top: 1px solid #D6D4CC; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #3A3A36; line-height: 1.5; }
  .wf-x-lib-rules b { color: #1C1C1A; }
  .wf-x-lib-hxkey { display: inline-block; width: 10px; height: 10px; border: 1.5px dashed #2B59C3; vertical-align: -1px; }

  .wf-x-lib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  h2.wf-x-lib-sec { font: 600 22px 'Space Grotesk', Inter, sans-serif; margin: 8px 0 0; scroll-margin-top: 90px; }
  .wf-x-lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .wf-x-lib-card { background: #FFFFFF; border: 1px solid #D6D4CC; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .wf-x-lib-card.on { border: 2px solid #1C1C1A; box-shadow: 5px 5px 0 #1C1C1A; }
  .wf-x-lib-card.hx { border: 1.5px dashed #2B59C3; }
  .wf-x-lib-card.hx.on { border-style: solid; border-color: #2B59C3; box-shadow: 5px 5px 0 #2B59C3; }
  .wf-x-lib-cf { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; margin-top: auto; }
  .wf-x-lib-cf b { display: block; font-size: 14px; }
  .wf-x-lib-cf .t { font: 11.5px 'JetBrains Mono', monospace; color: #55554F; display: block; overflow-wrap: anywhere; }
  .wf-x-lib-det { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 500; border: 1.5px solid #1C1C1A; border-radius: 6px; padding: 5px 10px; white-space: nowrap; }
  .wf-x-lib-det:hover { background: #EFEDE6; }
  .wf-x-lib-card.on .wf-x-lib-det { background: #1C1C1A; color: #FFFFFF; }
  .wf-x-lib-none { border: 1.5px dashed #C9C7BF; border-radius: 12px; padding: 48px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }

  /* Card previews: static drawings, copied from the design. */
  .pv { height: 150px; background: #F7F6F2; border-bottom: 1px solid #E3E1DA; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; font-size: 13px; position: relative; color: #1C1C1A; }
  .pv .b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #1C1C1A; background: #FFFFFF; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .pv .b.p { background: #1C1C1A; color: #FFFFFF; } .pv .b.g { border-color: transparent; background: transparent; text-decoration: underline; } .pv .b.d { border-style: dashed; } .pv .b.x { border-color: #C9C7BF; color: #8A887F; background: #F2F1EC; }
  .pv .in { height: 32px; border: 1.5px solid #8A887F; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; padding: 0 10px; font-size: 12.5px; color: #55554F; gap: 6px; }
  .pv .lb { font-size: 12px; font-weight: 500; }
  .pv .ck { width: 15px; height: 15px; border: 1.5px solid #1C1C1A; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex: none; }
  .pv .ck.on { background: #1C1C1A; color: #FFFFFF; }
  .pv .rd { width: 15px; height: 15px; border: 1.5px solid #1C1C1A; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .pv .bd { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 500; border: 1.5px solid #1C1C1A; border-radius: 10px; padding: 0 8px; line-height: 1.6; white-space: nowrap; }
  .pv .bd.dn { background: #1C1C1A; color: #FFFFFF; } .pv .bd.pr { border-style: dashed; } .pv .bd.ar { border-color: #8A887F; color: #55554F; }
  .pv .bar { height: 7px; border-radius: 4px; background: #D6D4CC; }
  .pv .blk { background: #EFEDE6; border: 1px solid #D6D4CC; border-radius: 5px; }
  .pv .av { width: 28px; height: 28px; border-radius: 50%; background: #EFEDE6; border: 1.5px solid #8A887F; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; flex: none; }
  .pv .tg { background: #EFEDE6; border-radius: 4px; padding: 1px 7px; font-size: 11.5px; }
  .pv .ph { background: #EFEDE6; border: 1.5px solid #C9C7BF; border-radius: 6px; position: relative; overflow: hidden; }
  .pv .ph::before, .pv .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, transparent calc(50% - .75px), #C9C7BF calc(50% - .75px), #C9C7BF calc(50% + .75px), transparent calc(50% + .75px)); }
  .pv .ph::after { transform: scaleX(-1); }
  .pv .frm { border: 1.5px solid #1C1C1A; border-radius: 8px; background: #FFFFFF; }
  .pv .col { display: flex; flex-direction: column; gap: 6px; }
  .pv .row { display: flex; align-items: center; gap: 6px; }
  .pv .mono { font-family: 'JetBrains Mono', monospace; }

  /* Details panel */
  .wf-x-lib-aside { flex: none; width: 400px; position: sticky; top: 89px; max-height: calc(100vh - 113px); overflow: auto; background: #FFFFFF; border: 1.5px solid #1C1C1A; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
  .wf-x-lib-aside.hx { border-color: #2B59C3; }
  .wf-x-lib-aside h2, .wf .wf-x-lib-aside h2 { margin: 0; font: 700 26px/1.1 'Space Grotesk', Inter, sans-serif; }
  .wf-x-lib-tag { font: 13px 'JetBrains Mono', monospace; background: #EFEDE6; border-radius: 4px; padding: 3px 8px; align-self: flex-start; overflow-wrap: anywhere; }
  p.wf-x-lib-desc { margin: 0; font-size: 15px; line-height: 1.55; color: #3A3A36; }
  .wf-x-lib-blk { display: flex; flex-direction: column; gap: 8px; }
  .wf-x-lib-live { border: 1px solid #D6D4CC; border-radius: 10px; padding: 16px; background: #F7F6F2; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .wf-x-lib-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .wf-x-lib-icons div { display: flex; align-items: center; gap: 8px; font: 11px 'JetBrains Mono', monospace; color: #55554F; }
  .wf-x-lib-attrs { border-top: 1px solid #D6D4CC; }
  .wf-x-lib-attrs div { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid #E3E1DA; }
  .wf-x-lib-attrs code { font: 600 12.5px 'JetBrains Mono', monospace; overflow-wrap: anywhere; }
  .wf-x-lib-attrs span { font-size: 13px; color: #3A3A36; line-height: 1.45; }
  .wf-x-lib-code { position: relative; background: #1C1C1A; color: #E9E7E0; border-radius: 10px; font: 12.5px/1.65 'JetBrains Mono', monospace; padding: 14px 16px; padding-right: 70px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .wf-x-lib-copy { all: unset; cursor: pointer; position: absolute; top: 8px; right: 8px; font: 11px 'JetBrains Mono', monospace; color: #E9E7E0; border: 1px solid #55554F; border-radius: 6px; padding: 3px 8px; }
  .wf-x-lib-copy:hover { border-color: #A8A69E; }
  .wf-x-lib-states { background: #F7F6F2; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #3A3A36; display: flex; flex-direction: column; gap: 4px; }
  .wf-x-lib-states b { color: #1C1C1A; }
  .wf-x-lib-hxnote { border: 1.5px dashed #2B59C3; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #1E3F8A; background: #EAF0FB; }
  .wf-x-lib-close { all: unset; cursor: pointer; display: none; align-self: flex-end; font-size: 13px; border: 1.5px solid #1C1C1A; border-radius: 6px; padding: 4px 10px; }
  .wf-x-lib-scrim { display: none; }

  @media (max-width: 1180px) {
    .wf-x-lib-aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); max-height: none; border-radius: 0; border-width: 0 0 0 1.5px; z-index: 40; transform: translateX(100%); transition: transform .18s ease; visibility: hidden; }
    .wf-x-lib-aside.open { transform: none; visibility: visible; }
    .wf-x-lib-close { display: inline-block; }
    .wf-x-lib-scrim.open { display: block; position: fixed; inset: 0; background: rgba(28,28,26,.35); z-index: 39; }
  }
  @media (max-width: 760px) {
    .wf-x-lib-body { flex-direction: column; padding: 16px; }
    .wf-x-lib-nav { position: static; width: auto; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .wf-x-lib-nav .wf-x-lib-k, .wf-x-lib-rules { display: none; }
    .wf-x-lib-cat { border: 1px solid #D6D4CC; padding: 6px 10px; font-size: 13px; }
    .wf-x-lib-search { order: 3; flex: 1 1 100%; margin-left: 0; }
    .wf-x-lib-count { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .wf-x-lib-aside { transition: none; } }
</style>
</head>
<body class="lib wf">
<header class="wf-x-lib-head">
  <div class="wf-x-lib-head-in">
    <a class="wf-x-lib-brand" href="#" data-top aria-label="Component library, back to top">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="#1C1C1A" stroke-width="2.6"><path d="M10 5H5v22h5M22 5h5v22h-5" stroke-linecap="square"/><path d="M9.5 11l2.8 10 3.7-7.5 3.7 7.5 2.8-10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Component library</b>
    </a>
    <span class="wf-x-lib-count" id="count" aria-live="polite"></span>
    <label class="wf-x-lib-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="1.8" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Search: table, modal, empty…" aria-label="Search components" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <a class="wf-x-lib-home" id="home" href="https://dobrinov.github.io/wireframe/">← Wireframe home</a>
  </div>
</header>

<div class="wf-x-lib-body">
  <nav class="wf-x-lib-nav" aria-label="Categories">
    <div class="wf-x-lib-k" style="padding:0 12px 8px">Categories</div>
    <div id="cats" style="display:contents"></div>
    <div class="wf-x-lib-rules">
      <b>Style rules</b>
      <span>Greyscale only. Ink fill = selected, dashed = problem, soft line = disabled.</span>
      <span><span class="wf-x-lib-hxkey"></span> Blue dashed = the prototype overlay, never part of a design.</span>
    </div>
  </nav>

  <main class="wf-x-lib-main" id="main"></main>

  <div class="wf-x-lib-scrim" id="scrim"></div>
  <aside class="wf-x-lib-aside" id="aside" aria-label="Component details" tabindex="-1"></aside>
</div>

<script type="module">
  import COMPONENTS from '/_wf/library-data.js';
  const wf = await window.wfReady;
  const CATS = [['All', 'All'], ['Layout', 'Layout'], ['Content', 'Content'], ['Inputs', 'Inputs'], ['Navigation', 'Navigation'], ['Data', 'Data display'], ['Feedback', 'Feedback & overlays'], ['Harness', 'Prototype overlay']];
  const label = Object.fromEntries(CATS);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);
  const fromHash = () => new URLSearchParams(location.hash.slice(1));
  const state = { q: '', cat: fromHash().get('cat') || 'All', picked: fromHash().get('c') || 'table' };
  if (!COMPONENTS.some((c) => c.id === state.picked)) state.picked = COMPONENTS[0].id;
  const narrow = matchMedia('(max-width: 1180px)');

  const match = (c) => (state.cat === 'All' || c.cat === state.cat)
    && (!state.q || `${c.name} ${c.tag} ${c.desc} ${label[c.cat]}`.toLowerCase().includes(state.q));

  function renderCats() {
    $('cats').innerHTML = CATS.map(([k, l]) => `<button class="wf-x-lib-cat" data-cat="${k}" aria-pressed="${state.cat === k}">${esc(l)}<span>${k === 'All' ? COMPONENTS.length : COMPONENTS.filter((c) => c.cat === k).length}</span></button>`).join('');
  }

  function renderGrid() {
    const shown = COMPONENTS.filter(match);
    $('count').textContent = `${shown.length} of ${COMPONENTS.length} components`;
    if (!shown.length) {
      $('main').innerHTML = `<div class="wf-x-lib-none"><b style="font-size:16px">No component matches “${esc(state.q)}”</b><span style="color:#55554F">Try a broader word, or build it from the style recipe (wf docs style).</span><button class="wf-x-lib-det" data-clear>Clear search</button></div>`;
      return;
    }
    $('main').innerHTML = CATS.slice(1).map(([k, l]) => {
      const items = shown.filter((c) => c.cat === k);
      if (!items.length) return '';
      return `<h2 class="wf-x-lib-sec" id="cat-${k}">${esc(l)}</h2><div class="wf-x-lib-grid">${items.map((c) => `
        <div class="wf-x-lib-card${c.harness ? ' hx' : ''}${c.id === state.picked ? ' on' : ''}" data-id="${c.id}">
          <div class="pv" aria-hidden="true"${c.pvStyle ? ` style="${esc(c.pvStyle)}"` : ''}>${c.preview}</div>
          <div class="wf-x-lib-cf"><div><b>${esc(c.name)}</b><span class="t">${esc(c.tag)}</span></div><button class="wf-x-lib-det" data-pick="${c.id}" aria-label="Details: ${esc(c.name)}">Details</button></div>
        </div>`).join('')}</div>`;
    }).join('');
  }

  function renderAside() {
    const c = COMPONENTS.find((x) => x.id === state.picked) || COMPONENTS[0];
    const a = $('aside');
    a.classList.toggle('hx', !!c.harness);
    a.innerHTML = `
      <button class="wf-x-lib-close" data-close>Close</button>
      <div class="wf-x-lib-blk" style="gap:6px"><span class="wf-x-lib-k">${esc(label[c.cat])}</span><h2>${esc(c.name)}</h2><span class="wf-x-lib-tag">${esc(c.tag)}</span></div>
      <p class="wf-x-lib-desc">${esc(c.desc)}</p>
      ${c.harness ? '<div class="wf-x-lib-hxnote">Part of the prototype overlay that wf adds to every prototype. Shown here for reference; never use it in a design.</div>' : ''}
      ${c.live ? `<div class="wf-x-lib-blk"><span class="wf-x-lib-k">Live example</span><div class="wf-x-lib-live">${c.live}</div></div>` : ''}
      ${c.attrs?.length ? `<div class="wf-x-lib-blk"><span class="wf-x-lib-k">Attributes &amp; API</span><div class="wf-x-lib-attrs">${c.attrs.map(([k, v]) => `<div><code>${esc(k)}</code><span>${esc(v)}</span></div>`).join('')}</div></div>` : ''}
      ${c.events ? `<div class="wf-x-lib-blk" style="gap:6px"><span class="wf-x-lib-k">Events</span><span class="wf-x-lib-mono" style="font-size:12.5px;line-height:1.6">${esc(c.events)}</span></div>` : ''}
      <div class="wf-x-lib-blk"><span class="wf-x-lib-k">Usage</span><pre class="wf-x-lib-code"><button class="wf-x-lib-copy" data-copy>Copy</button>${esc(c.code)}</pre></div>
      <div class="wf-x-lib-states"><b>States</b><span>${esc(c.states)}</span></div>`;
    if (c.live.includes('icon-grid')) $('icon-grid').innerHTML = wf.icons.map((n) => `<div><wf-icon name="${n}"></wf-icon>${n}</div>`).join('');
    a.scrollTop = 0;
  }

  function setHash() {
    const p = new URLSearchParams();
    if (state.cat !== 'All') p.set('cat', state.cat);
    p.set('c', state.picked);
    history.replaceState(null, '', `#${p}`);
  }
  function openAside(focus) {
    if (narrow.matches) { $('aside').classList.add('open'); $('scrim').classList.add('open'); }
    if (focus) $('aside').focus({ preventScroll: true });
  }
  function closeAside() {
    $('aside').classList.remove('open'); $('scrim').classList.remove('open');
    document.querySelector(`[data-pick="${state.picked}"]`)?.focus({ preventScroll: true });
  }

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-cat],[data-pick],[data-clear],[data-close],[data-copy],[data-top],#scrim,#demo-confirm,#demo-toast2');
    if (!t) return;
    if (t.dataset.cat) { state.cat = t.dataset.cat; renderCats(); renderGrid(); setHash(); scrollTo({ top: 0 }); }
    else if (t.dataset.pick) {
      state.picked = t.dataset.pick;
      document.querySelectorAll('.wf-x-lib-card.on').forEach((n) => n.classList.remove('on'));
      t.closest('.wf-x-lib-card').classList.add('on');
      renderAside(); setHash(); openAside(true);
    }
    else if ('clear' in t.dataset) { state.q = ''; state.cat = 'All'; $('q').value = ''; renderCats(); renderGrid(); setHash(); }
    else if ('close' in t.dataset || t.id === 'scrim') closeAside();
    else if ('copy' in t.dataset) {
      const c = COMPONENTS.find((x) => x.id === state.picked);
      try { await navigator.clipboard.writeText(c.code); t.textContent = 'Copied'; } catch { t.textContent = 'Select & copy'; }
      setTimeout(() => { t.textContent = 'Copy'; }, 1500);
    }
    else if ('top' in t.dataset) { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (t.id === 'demo-confirm') { if (await wf.confirm({ title: 'Delete report?', text: 'This cannot be undone.', confirm: 'Delete', danger: true })) wf.toast('Report deleted'); }
    else if (t.id === 'demo-toast2') wf.toast('Expense archived', { action: 'Undo', onAction: () => wf.toast('Restored') });
  });
  $('q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); renderGrid(); });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && $('aside').classList.contains('open')) closeAside();
  });

  renderCats(); renderGrid(); renderAside();
  if (fromHash().get('c')) requestAnimationFrame(() => document.querySelector(`.wf-x-lib-card[data-id="${state.picked}"]`)?.scrollIntoView({ block: 'center' }));
</script>
</body>
